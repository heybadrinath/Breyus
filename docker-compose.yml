version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: breyus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: breyus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - breyus-network

  # Add other services like backend and frontend if needed

networks:
  breyus-network:
    driver: bridge

volumes:
  postgres_data: 