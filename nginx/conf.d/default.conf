# Breyus Platform - Server Configuration
# Routes traffic to frontend, admin portal, and API services

server {
    listen 80;
    server_name localhost;

    # Client body size limit (for file uploads)
    client_max_body_size 50M;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # =========================================================================
    # API Routes (/api/*)
    # Proxies to NestJS Backend
    # =========================================================================
    location /api/ {
        # Rewrite to remove /api prefix before forwarding
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;
    }

    # =========================================================================
    # Static Uploads (/uploads/*)
    # Serves uploaded files (images, documents) from backend
    # =========================================================================
    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static uploads
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # WebSocket Routes for Backend (/socket.io/*)
    # Supports real-time features
    # =========================================================================
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # AI Service Routes (/ai/*)
    # Proxies to FastAPI AI Service (uses variable-based proxy for graceful handling)
    # =========================================================================
    location /ai/ {
        # Rewrite to remove /ai prefix before forwarding
        rewrite ^/ai/(.*) /$1 break;

        # Use variable-based proxy_pass to allow service to be unavailable
        set $ai_upstream "http://ai-service:8000";
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for AI operations
        proxy_read_timeout 120s;

        # Rate limiting for AI service
        limit_req zone=api_limit burst=10 nodelay;
    }

    # =========================================================================
    # Admin Portal Routes (/admin/*)
    # Serves Admin Portal SPA
    # =========================================================================
    location /admin/ {
        # Rewrite to remove /admin prefix for the upstream
        rewrite ^/admin/(.*) /$1 break;

        proxy_pass http://admin_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin portal root redirect
    location = /admin {
        return 301 /admin/;
    }

    # =========================================================================
    # Health Check Endpoint
    # Used by load balancers and monitoring
    # =========================================================================
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # Main Frontend Routes (/)
    # Serves React SPA for main application
    # =========================================================================
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # Error Pages
    # =========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# =========================================================================
# Direct port access (for development/debugging)
# Allows accessing services directly on their ports
# =========================================================================

# Backend API direct access on port 3001 (handled by Docker port mapping)
# Admin Portal direct access on port 5173 (handled by Docker port mapping)
# AI Service direct access on port 8000 (handled by Docker port mapping)
