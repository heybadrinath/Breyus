# Breyus AI Services Docker Compose
# Run with: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL with pgvector and PostGIS extensions
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: breyus_ai_postgres
    container_name: breyus_ai_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: breyus_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d breyus_ai" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and job status
  redis:
    image: redis:7-alpine
    container_name: breyus_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Server (FastAPI)
  ai-server:
    build: .
    container_name: breyus_ai_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-false}
      - AI_SERVER_PORT=8000
      - AI_API_KEY=${AI_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=breyus_ai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-claude-3-sonnet-20240229}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L12-v2}
      - PIPELINE_DEV_NAME=${PIPELINE_DEV_NAME}
    volumes:
      - ./pipeline:/app/pipeline
      - ./raw_data:/app/raw_data
      - ./server:/app/server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:


networks:
  default:
    name: breyus_ai_network
